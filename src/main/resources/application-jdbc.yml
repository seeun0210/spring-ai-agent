# Optional profile for switching Chat Memory storage from in-memory to JDBC.
#
# Required dependencies before enabling this profile:
#   implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
#   runtimeOnly 'com.h2database:h2'
#
# Run:
#   ./gradlew bootRun --args='--spring.profiles.active=jdbc'

spring:
  datasource:
    url: jdbc:h2:mem:baedal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: embedded
            platform: postgresql
